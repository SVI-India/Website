<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Siddhi Vinayak</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== LOGIN STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a2a44 0%, #1a4a6e 50%, #0a2a44 100%); padding: 20px; }
        .login-container { width: 100%; max-width: 460px; }
        .login-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 24px; padding: 40px 36px; box-shadow: 0 40px 80px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-logo { font-size: 2.4rem; color: #facc15; display: block; }
        .login-header h1 { font-size: 1.8rem; font-weight: 800; color: #0a2a44; margin: 4px 0 2px; }
        .login-header h1 span { color: #facc15; }
        .login-header p { color: #5a7a8e; font-size: 0.95rem; }
        
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #aabbcc; font-size: 1rem; }
        .input-group input { width: 100%; padding: 14px 16px 14px 46px; border: 2px solid #e0e8f0; border-radius: 12px; font-size: 1rem; font-family: inherit; transition: all 0.3s ease; background: #f8fafc; }
        .input-group input:focus { border-color: #0a2a44; outline: none; box-shadow: 0 0 0 4px rgba(10,42,68,0.06); background: #ffffff; }
        .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aabbcc; cursor: pointer; padding: 4px; }
        
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #0a2a44, #1a4a6e); color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(10,42,68,0.25); }
        
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divider hr { flex: 1; border: none; border-top: 2px solid #e0e8f0; }
        .divider span { color: #7a9aaa; font-weight: 500; font-size: 0.9rem; }
        
        .social-btn { width: 100%; padding: 14px; border: 2px solid #e0e8f0; border-radius: 12px; background: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .social-btn:hover { border-color: #0a2a44; background: #f8fafc; }
        .social-btn.google { color: #4285F4; }
        .social-btn.phone { color: #25D366; }
        .social-btn i { font-size: 1.4rem; }
        
        .otp-section { display: none; margin-top: 12px; }
        .otp-section.active { display: block; }
        
        .login-footer { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e8f0f8; }
        .login-footer a { color: #0a2a44; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; }
        .login-footer a:hover { color: #facc15; }
        
        .toast { background: #0a2a44; color: white; padding: 12px 20px; border-radius: 12px; margin-top: 16px; font-size: 0.95rem; display: none; text-align: center; }
        .toast.show { display: block; }
        .toast.error { background: #dc3545; }
        .toast.success { background: #198754; }
        
        @media (max-width:480px) { .login-card { padding: 28px 20px; } }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="login-logo">✦</span>
            <h1>Siddhi<span>Vinayak</span></h1>
            <p>Sign in to your account</p>
        </div>
        
        <div id="toast" class="toast"></div>
        
        <!-- ===== EMAIL LOGIN ===== -->
        <form id="emailLoginForm" onsubmit="loginWithEmail(event)">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="emailInput" placeholder="Email Address" required />
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="passwordInput" placeholder="Password" required />
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="divider"><hr /><span>OR</span><hr /></div>
        
        <!-- ===== SOCIAL LOGINS ===== -->
        <button class="social-btn google" onclick="loginWithGoogle()">
            <i class="fab fa-google"></i> Continue with Google
        </button>
        
        <button class="social-btn phone" onclick="showPhoneLogin()">
            <i class="fas fa-phone"></i> Login with Phone (OTP)
        </button>
        
        <div class="otp-section" id="otpSection">
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phoneInput" placeholder="+91 9876543210" />
            </div>
            <button class="login-btn" onclick="sendOTP()" style="background:#25D366;">
                <i class="fas fa-paper-plane"></i> Send OTP
            </button>
            <div class="input-group" style="margin-top:12px;">
                <i class="fas fa-key"></i>
                <input type="text" id="otpInput" placeholder="6-digit OTP" maxlength="6" />
            </div>
            <button class="login-btn" onclick="verifyOTP()" style="background:#0a2a44;">
                <i class="fas fa-check"></i> Verify OTP
            </button>
        </div>
        
        <div class="login-footer">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</div>

<!-- ===== FIREBASE SDKs ===== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
    apiKey: "AIzaSyBkYgIYg92dLsWpFwChTZj9J-8IIkPstB8",
    authDomain: "siddhivinayak-7f3c4.firebaseapp.com",
    projectId: "siddhivinayak-7f3c4",
    storageBucket: "siddhivinayak-7f3c4.firebasestorage.app",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef123456"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== TOAST =====
const toast = document.getElementById('toast');
let toastTimeout;

function showToast(msg, type = 'success') {
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.className = 'toast'; }, 4000);
}

// ===== TOGGLE PASSWORD =====
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.querySelector('.toggle-password i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}

// ===== EMAIL LOGIN =====
function loginWithEmail(e) {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    
    if (!email || !password) {
        showToast('⚠️ Please enter email and password', 'error');
        return;
    }
    
    auth.signInWithEmailAndPassword(email, password)
        .then(() => {
            showToast('✅ Login successful!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        })
        .catch(err => showToast('❌ ' + err.message, 'error'));
}

// ===== GOOGLE LOGIN =====
function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then(() => {
            showToast('✅ Google login successful!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        })
        .catch(err => showToast('❌ ' + err.message, 'error'));
}

// ===== PHONE LOGIN =====
let confirmationResult = null;

function showPhoneLogin() {
    document.getElementById('otpSection').classList.toggle('active');
}

function sendOTP() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone || phone.length < 10) {
        showToast('⚠️ Enter valid phone number with country code (e.g., +91 9876543210)', 'error');
        return;
    }
    
    const appVerifier = new firebase.auth.RecaptchaVerifier('otpSection', {
        size: 'invisible',
        callback: () => {}
    });
    
    auth.signInWithPhoneNumber(phone, appVerifier)
        .then((result) => {
            confirmationResult = result;
            showToast('📨 OTP sent to ' + phone, 'success');
        })
        .catch(err => showToast('❌ ' + err.message, 'error'));
}

function verifyOTP() {
    const otp = document.getElementById('otpInput').value.trim();
    if (!otp || otp.length < 6) {
        showToast('⚠️ Enter 6-digit OTP', 'error');
        return;
    }
    if (!confirmationResult) {
        showToast('⚠️ Please request OTP first', 'error');
        return;
    }
    confirmationResult.confirm(otp)
        .then(() => {
            showToast('✅ Phone verified! Logged in.', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        })
        .catch(err => showToast('❌ Invalid OTP: ' + err.message, 'error'));
}

// ===== CHECK SESSION =====
auth.onAuthStateChanged(user => {
    if (user) {
        // Already logged in, redirect
        window.location.href = 'index.html';
    }
});

// ===== ADMIN FALLBACK (if Google login fails) =====
// Admin email: bhakarramuram2@gmail.com
// Password: abcd._.1234

console.log('🔐 Admin Login: bhakarramuram2@gmail.com');
console.log('🔑 Password: abcd._.1234');
</script>

</body>
</html>
