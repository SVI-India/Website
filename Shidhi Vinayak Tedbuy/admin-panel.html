<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Siddhi Vinayak</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Same admin styles as before, but updated for Firebase */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1e2b37; overflow-x: hidden; }
        .admin-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #0a2a44; color: white; padding: 24px 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-brand h2 { font-size: 1.4rem; font-weight: 800; }
        .sidebar-brand h2 span { color: #facc15; }
        .sidebar-brand p { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; }
        .sidebar-nav { padding: 20px 0; flex: 1; }
        .sidebar-nav .nav-label { padding: 8px 24px; font-size: 0.7rem; text-transform: uppercase; color: rgba(255,255,255,0.3); letter-spacing: 2px; font-weight: 600; }
        .sidebar-nav a { display: flex; align-items: center; gap: 14px; padding: 12px 24px; color: rgba(255,255,255,0.6); text-decoration: none; transition: all 0.3s ease; border-left: 3px solid transparent; cursor: pointer; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(255,255,255,0.05); color: white; border-left-color: #facc15; }
        .sidebar-nav a i { width: 20px; text-align: center; font-size: 1.1rem; }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06); }
        .sidebar-footer a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; transition: all 0.3s ease; }
        .sidebar-footer a:hover { color: #facc15; }
        
        .main-content { margin-left: 260px; flex: 1; padding: 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: white; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .top-bar h1 { font-size: 1.4rem; font-weight: 800; color: #0a2a44; }
        .top-bar .user-info { display: flex; align-items: center; gap: 16px; }
        .top-bar .user-info .avatar { width: 40px; height: 40px; background: #facc15; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a2a44; }
        .top-bar .user-info span { font-weight: 600; color: #0a2a44; }
        .top-bar .user-info .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .top-bar .user-info .logout-btn:hover { background: #b02a37; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .stat-card .stat-icon { font-size: 2rem; margin-bottom: 8px; }
        .stat-card .stat-number { font-size: 2rem; font-weight: 900; color: #0a2a44; }
        .stat-card .stat-label { color: #5a7a8e; font-size: 0.9rem; }
        
        .panel-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px; }
        .panel-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .panel-card .card-header h3 { font-size: 1.2rem; color: #0a2a44; }
        
        .btn-primary { background: #0a2a44; color: white; border: none; padding: 10px 24px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: #facc15; color: #0a2a44; }
        .btn-success { background: #28a745; color: white; border: none; padding: 6px 16px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 16px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-warning { background: #ffc107; color: #0a2a44; border: none; padding: 6px 16px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; }
        table th { text-align: left; padding: 12px; border-bottom: 2px solid #e8f0f8; color: #5a7a8e; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        table td { padding: 12px; border-bottom: 1px solid #e8f0f8; vertical-align: middle; }
        table tr:hover { background: #f8fafc; }
        .product-img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .status-badge { padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
        .status-badge.in-stock { background: #d4edda; color: #155724; }
        .status-badge.low-stock { background: #fff3cd; color: #856404; }
        .status-badge.out-of-stock { background: #f8d7da; color: #721c24; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 24px; padding: 36px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; animation: modalSlide 0.3s ease; }
        @keyframes modalSlide { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box h2 { font-size: 1.6rem; color: #0a2a44; margin-bottom: 20px; }
        .modal-box .close-modal { float: right; background: none; border: none; font-size: 1.6rem; color: #5a7a8e; cursor: pointer; }
        .modal-box .form-group { margin-bottom: 16px; }
        .modal-box .form-group label { display: block; font-weight: 600; color: #0a2a44; margin-bottom: 4px; }
        .modal-box .form-group input, .modal-box .form-group select, .modal-box .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e0e8f0; border-radius: 12px; font-size: 1rem; font-family: inherit; transition: all 0.3s ease; }
        .modal-box .form-group input:focus, .modal-box .form-group select:focus, .modal-box .form-group textarea:focus { border-color: #0a2a44; outline: none; box-shadow: 0 0 0 4px rgba(10,42,68,0.06); }
        .empty-state { text-align: center; padding: 40px 20px; color: #7a9aaa; }
        .empty-state i { font-size: 3rem; color: #dce6ef; margin-bottom: 12px; }
        .empty-state h4 { color: #0a2a44; margin-bottom: 4px; }
        
        @media (max-width:1024px) { .stats-grid { grid-template-columns: repeat(2,1fr); } }
        @media (max-width:768px) {
            .sidebar { width: 72px; padding: 16px 0; }
            .sidebar-brand h2, .sidebar-brand p, .sidebar-nav .nav-label, .sidebar-nav a span, .sidebar-footer a span { display: none; }
            .sidebar-nav a { padding: 12px; justify-content: center; }
            .sidebar-nav a i { font-size: 1.4rem; }
            .main-content { margin-left: 72px; padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width:480px) { .stats-grid { grid-template-columns: 1fr; } .modal-box { padding: 24px; } }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>✦ Siddhi<span>Vinayak</span></h2>
            <p>Admin Panel</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a class="active" data-page="dashboard" onclick="showPage('dashboard')">
                <i class="fas fa-th-large"></i> <span>Dashboard</span>
            </a>
            <a data-page="products" onclick="showPage('products')">
                <i class="fas fa-box"></i> <span>Products</span>
            </a>
            <a data-page="orders" onclick="showPage('orders')">
                <i class="fas fa-shopping-cart"></i> <span>Orders</span>
            </a>
            <a data-page="users" onclick="showPage('users')">
                <i class="fas fa-users"></i> <span>Users</span>
            </a>
            <a data-page="messages" onclick="showPage('messages')">
                <i class="fas fa-envelope"></i> <span>Messages</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html"><i class="fas fa-arrow-left"></i> <span>Back to Site</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 id="pageTitle">📊 Dashboard</h1>
            <div class="user-info">
                <span id="adminName">Admin</span>
                <div class="avatar" id="adminAvatar">A</div>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div id="page-dashboard">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-number" id="totalProducts">0</div><div class="stat-label">Products</div></div>
                <div class="stat-card"><div class="stat-icon">🛒</div><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Orders</div></div>
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-number" id="totalUsers">0</div><div class="stat-label">Users</div></div>
                <div class="stat-card"><div class="stat-icon">💬</div><div class="stat-number" id="totalMessages">0</div><div class="stat-label">Messages</div></div>
            </div>
            <div class="panel-card">
                <div class="card-header"><h3>📋 Recent Users</h3></div>
                <div id="recentUsers"><div class="empty-state"><i class="fas fa-users"></i><h4>No users yet</h4></div></div>
            </div>
        </div>

        <div id="page-products" style="display:none;">
            <div class="panel-card">
                <div class="card-header">
                    <h3>📦 Products</h3>
                    <button class="btn-primary" onclick="openAddProductModal()"><i class="fas fa-plus"></i> Add Product</button>
                </div>
                <div id="productsTableWrapper"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h4>Loading...</h4></div></div>
            </div>
        </div>

        <div id="page-orders" style="display:none;">
            <div class="panel-card">
                <div class="card-header"><h3>🛒 Orders</h3></div>
                <div id="ordersTableWrapper"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h4>Loading...</h4></div></div>
            </div>
        </div>

        <div id="page-users" style="display:none;">
            <div class="panel-card">
                <div class="card-header"><h3>👥 Users</h3></div>
                <div id="usersTableWrapper"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h4>Loading...</h4></div></div>
            </div>
        </div>

        <div id="page-messages" style="display:none;">
            <div class="panel-card">
                <div class="card-header"><h3>💬 Messages</h3></div>
                <div id="messagesTableWrapper"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h4>Loading...</h4></div></div>
            </div>
        </div>
    </main>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="productModal">
    <div class="modal-box">
        <button class="close-modal" onclick="closeModal()">&times;</button>
        <h2 id="modalTitle">Add Product</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="editProductId" />
            <div class="form-group"><label>Product Name *</label><input type="text" id="prodName" required /></div>
            <div class="form-group">
                <label>Brand</label>
                <select id="prodBrand"><option value="Nikolux">Nikolux</option><option value="Life Star">Life Star</option><option value="Sanjivni">Sanjivni</option></select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="prodCategory"><option value="Powder">Powder</option><option value="Liquid">Liquid</option><option value="Cake">Cake</option></select>
            </div>
            <div class="form-group"><label>Price (₹) *</label><input type="number" id="prodPrice" required min="0" /></div>
            <div class="form-group"><label>Stock *</label><input type="number" id="prodStock" required min="0" /></div>
            <div class="form-group"><label>Description</label><textarea id="prodDesc" rows="3"></textarea></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="prodImage" placeholder="https://..." /></div>
            <button type="submit" class="btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-save"></i> Save</button>
        </form>
    </div>
</div>

<!-- ===== FIREBASE SDKs ===== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBkYgIYg92dLsWpFwChTZj9J-8IIkPstB8",
    authDomain: "siddhivinayak-7f3c4.firebaseapp.com",
    projectId: "siddhivinayak-7f3c4",
    storageBucket: "siddhivinayak-7f3c4.firebasestorage.app",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef123456"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== CHECK ADMIN =====
auth.onAuthStateChanged(user => {
    if (!user || user.email !== 'shidhivinayakindustry.svi@gmail.com') {
        alert('❌ Access denied! Admin only.');
        window.location.href = 'login.html';
        return;
    }
    document.getElementById('adminName').textContent = user.displayName || 'Admin';
    document.getElementById('adminAvatar').textContent = (user.displayName || 'A')[0].toUpperCase();
    loadDashboard();
});

// ===== LOGOUT =====
function logout() {
    if (confirm('Logout?')) {
        auth.signOut();
        window.location.href = 'login.html';
    }
}

// ===== PAGE NAVIGATION =====
function showPage(page) {
    document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
    document.querySelector(`.sidebar-nav a[data-page="${page}"]`)?.classList.add('active');
    document.querySelectorAll('[id^="page-"]').forEach(el => el.style.display = 'none');
    document.getElementById(`page-${page}`).style.display = 'block';
    const titles = { dashboard: '📊 Dashboard', products: '📦 Products', orders: '🛒 Orders', users: '👥 Users', messages: '💬 Messages' };
    document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
    if (page === 'products') loadProducts();
    if (page === 'orders') loadOrders();
    if (page === 'users') loadUsers();
    if (page === 'messages') loadMessages();
}

// ===== DASHBOARD =====
function loadDashboard() {
    db.collection('products').get().then(snap => document.getElementById('totalProducts').textContent = snap.size);
    db.collection('orders').get().then(snap => document.getElementById('totalOrders').textContent = snap.size);
    db.collection('users').get().then(snap => document.getElementById('totalUsers').textContent = snap.size);
    db.collection('messages').get().then(snap => document.getElementById('totalMessages').textContent = snap.size);
    
    db.collection('users').orderBy('lastLogin', 'desc').limit(5).get().then(snap => {
        const container = document.getElementById('recentUsers');
        if (snap.empty) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h4>No users yet</h4></div>';
            return;
        }
        let html = '<ul style="list-style:none;padding:0;">';
        snap.forEach(doc => {
            const u = doc.data();
            html += `<li style="padding:10px 0;border-bottom:1px solid #f0f4f8;display:flex;justify-content:space-between;align-items:center;">
                <span><strong>${u.name || 'User'}</strong> — ${u.email || 'No email'}</span>
                <span style="font-size:0.85rem;color:#5a7a8e;">${u.role || 'user'}</span>
            </li>`;
        });
        html += '</ul>';
        container.innerHTML = html;
    });
}

// ===== PRODUCTS =====
function loadProducts() {
    const wrapper = document.getElementById('productsTableWrapper');
    db.collection('products').onSnapshot(snap => {
        if (snap.empty) {
            wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><h4>No products</h4><p>Click "Add Product" to get started</p></div>';
            return;
        }
        let html = `<table><thead><tr><th>Image</th><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
        snap.forEach(doc => {
            const p = doc.data();
            const statusClass = p.stock > 50 ? 'in-stock' : p.stock > 10 ? 'low-stock' : 'out-of-stock';
            const statusLabel = p.stock > 50 ? 'In Stock' : p.stock > 10 ? 'Low Stock' : 'Out of Stock';
            html += `<tr>
                <td><img src="${p.image || 'https://via.placeholder.com/50'}" class="product-img-thumb" /></td>
                <td><strong>${p.name}</strong></td>
                <td>${p.brand}</td>
                <td>₹${p.price}</td>
                <td><span class="status-badge ${statusClass}">${statusLabel} (${p.stock})</span></td>
                <td>
                    <button class="btn-warning btn-sm" onclick="editProduct('${doc.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn-danger btn-sm" onclick="deleteProduct('${doc.id}')"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        wrapper.innerHTML = html;
    });
}

function openAddProductModal() {
    document.getElementById('modalTitle').textContent = 'Add Product';
    document.getElementById('editProductId').value = '';
    document.getElementById('productForm').reset();
    document.getElementById('productModal').classList.add('active');
}

function editProduct(id) {
    db.collection('products').doc(id).get().then(doc => {
        if (!doc.exists) return;
        const p = doc.data();
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('editProductId').value = id;
        document.getElementById('prodName').value = p.name;
        document.getElementById('prodBrand').value = p.brand;
        document.getElementById('prodCategory').value = p.category;
        document.getElementById('prodPrice').value = p.price;
        document.getElementById('prodStock').value = p.stock;
        document.getElementById('prodDesc').value = p.description || '';
        document.getElementById('prodImage').value = p.image || '';
        document.getElementById('productModal').classList.add('active');
    });
}

function saveProduct(e) {
    e.preventDefault();
    const id = document.getElementById('editProductId').value;
    const data = {
        name: document.getElementById('prodName').value.trim(),
        brand: document.getElementById('prodBrand').value,
        category: document.getElementById('prodCategory').value,
        price: parseInt(document.getElementById('prodPrice').value),
        stock: parseInt(document.getElementById('prodStock').value),
        description: document.getElementById('prodDesc').value.trim(),
        image: document.getElementById('prodImage').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (!data.name || !data.price) { alert('⚠️ Name and Price required'); return; }
    const ref = id ? db.collection('products').doc(id) : db.collection('products').doc();
    ref.set(data, { merge: true }).then(() => {
        closeModal();
        alert('✅ Product saved!');
    });
}

function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    db.collection('products').doc(id).delete().then(() => alert('✅ Deleted!'));
}

function closeModal() {
    document.getElementById('productModal').classList.remove('active');
}

// ===== ORDERS =====
function loadOrders() {
    const wrapper = document.getElementById('ordersTableWrapper');
    db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snap => {
        if (snap.empty) {
            wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-shopping-cart"></i><h4>No orders yet</h4></div>';
            return;
        }
        let html = `<table><thead><tr><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead><tbody>`;
        snap.forEach(doc => {
            const o = doc.data();
            html += `<tr>
                <td>${o.customerName || 'Unknown'}</td>
                <td>${o.productName}</td>
                <td>${o.quantity}</td>
                <td>₹${o.total}</td>
                <td><span class="status-badge ${o.status === 'Delivered' ? 'in-stock' : 'low-stock'}">${o.status || 'Processing'}</span></td>
            </tr>`;
        });
        html += '</tbody></table>';
        wrapper.innerHTML = html;
    });
}

// ===== USERS =====
function loadUsers() {
    const wrapper = document.getElementById('usersTableWrapper');
    db.collection('users').onSnapshot(snap => {
        if (snap.empty) {
            wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h4>No users</h4></div>';
            return;
        }
        let html = `<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr></thead><tbody>`;
        snap.forEach(doc => {
            const u = doc.data();
            const roleEmoji = u.role === 'admin' ? '🛡️' : u.role === 'distributor' ? '🚚' : '👤';
            html += `<tr>
                <td><strong>${u.name || 'User'}</strong></td>
                <td>${u.email || 'N/A'}</td>
                <td>${u.phone || 'N/A'}</td>
                <td>${roleEmoji} ${u.role || 'user'}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        wrapper.innerHTML = html;
    });
}

// ===== MESSAGES =====
function loadMessages() {
    const wrapper = document.getElementById('messagesTableWrapper');
    db.collection('messages').orderBy('createdAt', 'desc').onSnapshot(snap => {
        if (snap.empty) {
            wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-envelope"></i><h4>No messages</h4></div>';
            return;
        }
        let html = `<table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Status</th></tr></thead><tbody>`;
        snap.forEach(doc => {
            const m = doc.data();
            html += `<tr>
                <td><strong>${m.name}</strong></td>
                <td>${m.email}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.message}</td>
                <td><span class="status-badge ${m.status === 'pending' ? 'low-stock' : 'in-stock'}">${m.status || 'Pending'}</span></td>
            </tr>`;
        });
        html += '</tbody></table>';
        wrapper.innerHTML = html;
    });
}

// ===== CLOSE MODAL ON OUTSIDE CLICK =====
document.getElementById('productModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ===== INIT =====
loadDashboard();
</script>
